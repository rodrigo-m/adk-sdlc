# ==============================================================================
# Cloud Build Pipeline: Production Environment (Manual Approval Required)
# ==============================================================================
# Triggered on push to 'main' but paused awaiting manual approval.
# Executes:
#   1. Dependency synchronization via 'uv'
#   2. Production regression evaluation suite (asserting non-zero exit code on failure)
#   3. JUnit XML report artifact archiving
#   4. In-place deployment to Vertex AI Reasoning Engine / Agent Engine (Prod)
#   5. Production smoke verification

steps:
  # ----------------------------------------------------------------------------
  # Step 1: Install uv and synchronize dependencies
  # ----------------------------------------------------------------------------
  - name: 'python:3.12-slim'
    id: 'sync-dependencies'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "--> Installing uv package manager..."
        pip install --no-cache-dir uv
        echo "--> Synchronizing project dependencies..."
        uv pip install --system -r greeting_agent/requirements.txt

  # ----------------------------------------------------------------------------
  # Step 2: Quality Gate - Production Regression Evaluation
  # ----------------------------------------------------------------------------
  - name: 'python:3.12-slim'
    id: 'eval-harness-quality-gate'
    entrypoint: 'sh'
    env:
      - 'GOOGLE_CLOUD_PROJECT=${_PROD_PROJECT_ID}'
      - 'GOOGLE_CLOUD_LOCATION=global'
      - 'LLM_LOCATION=global'
      - 'ENVIRONMENT=prod'
      - 'GCS_BUCKET_NAME=${_PROD_BUCKET}'
      - 'GOOGLE_GENAI_USE_VERTEXAI=true'
      - 'GOOGLE_GENAI_USE_ENTERPRISE=true'
    args:
      - '-c'
      - |
        set -e
        echo "--> Installing dependencies and running pytest eval harness..."
        pip install --no-cache-dir uv
        uv pip install --system -r greeting_agent/requirements.txt
        mkdir -p reports
        python -m pytest tests/test_eval_harness.py -v --junitxml=reports/eval-results.xml
        echo "--> Production evaluation harness passed successfully."

  # ----------------------------------------------------------------------------
  # Step 3: Deploy to Vertex AI Reasoning Engine (Production Project)
  # ----------------------------------------------------------------------------
  - name: 'python:3.12-slim'
    id: 'deploy-agent-prod'
    entrypoint: 'sh'
    env:
      - 'GOOGLE_CLOUD_PROJECT=${_PROD_PROJECT_ID}'
      - 'GOOGLE_CLOUD_LOCATION=${_REGION}'
      - 'ENVIRONMENT=prod'
      - 'GCS_BUCKET_NAME=${_PROD_BUCKET}'
      - 'GOOGLE_GENAI_USE_VERTEXAI=true'
      - 'GOOGLE_GENAI_USE_ENTERPRISE=true'
    args:
      - '-c'
      - |
        set -e
        echo "--> Deploying Greeting Agent to Production project: ${_PROD_PROJECT_ID}..."
        pip install --no-cache-dir uv
        uv pip install --system -r greeting_agent/requirements.txt
        chmod +x scripts/*.sh scripts/*.py
        ./scripts/deploy_agent.sh "${_PROD_PROJECT_ID}" "${_REGION}" "prod" "${_PROD_BUCKET}"

substitutions:
  _PROD_PROJECT_ID: 'your-prod-project-id'
  _PROD_BUCKET: 'your-prod-project-id-data'
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY

artifacts:
  objects:
    location: 'gs://${_PROD_BUCKET}/ci-reports/${BUILD_ID}'
    paths:
      - 'reports/eval-results.xml'
